<body class="bdy">
    <div class="login-container">
        <div class="welcome">
            <h1>Hello, Welcome!</h1>
            <p>Log in to access your portal!</p>
            <div class="school-bagde">HTU</div>
        </div>

        <form id="loginForm">
            <h2>Log In</h2>
                <div class="form">
                    <input type="text" 
                    id="studentName"
                    placeholder="Student Full Name" 
                    required>
                </div>
                <div class="form" >
                    <input type="text"
                    id="studentId"
                    placeholder="Student ID" 
                    required>
                    <!--a href="dashboard.html" class="btn">Log In</a-->
                    <button type="submit" class="btn">Log In</button>
                </div> 
                <p id="logInMessage"></p>   
        </form>

    </div>
   
</body>
